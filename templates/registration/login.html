{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - STUDYSYNC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-container">
    <div class="auth-box">
        <h2>Welcome Back to STUDYSYNC</h2>
        
        {% if form.errors %}
            <div class="error-text" style="font-size: 1rem; margin-bottom: 1rem; text-align: center;">
                Your username and password didn't match. Please try again.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
            <input type="hidden" name="next" value="{{ next }}" />
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem; color: var(--text-light);">
            New student? <a href="{% url 'student_register' %}" style="color: var(--primary); text-decoration: none; font-weight: 500;">Register here</a>
        </div>
    </div>
</body>
</html>
