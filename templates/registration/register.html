{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - STUDYSYNC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-container">
    <div class="auth-box" style="max-width: 500px;">
        <h2>Create an Account</h2>
        
        <form method="post">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <span class="help-text">{{ field.help_text }}</span>
                    {% endif %}
                    {% for error in field.errors %}
                        <span class="error-text">{{ error }}</span>
                    {% endfor %}
                </div>
            {% endfor %}
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;">Register</button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem; color: var(--text-light);">
            Already have an account? <a href="{% url 'login' %}" style="color: var(--primary); text-decoration: none; font-weight: 500;">Login here</a>
        </div>
    </div>

    </div>
</body>
</html>
