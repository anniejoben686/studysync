{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Login - STUDYSYNC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-container">
    <div class="auth-box">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #4f46e5, #3730a3); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 1.8rem;">👩‍🏫</div>
            <h2 style="margin: 0;">Instructor Login</h2>
            <p style="color: var(--text-light); font-size: 0.875rem; margin-top: 0.4rem;">Enter the credentials provided by the admin</p>
        </div>

        {% if form.errors %}
            <div class="error-text" style="font-size: 1rem; margin-bottom: 1rem; text-align: center;">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="post" action="{% url 'instructor_login' %}" autocomplete="off">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login as Instructor</button>
            <input type="hidden" name="next" value="{{ next }}" />
        </form>

        <div style="text-align: center; margin-top: 1.5rem; color: var(--text-light); font-size: 0.875rem;">
            <a href="{% url 'index' %}" style="color: var(--primary); text-decoration: none;">← Back to Home</a>
        </div>
    </div>
</body>
</html>
